<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#38bdf8;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#6366f1;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#a855f7;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)" />
    </radialGradient>

    <!-- Dynamic Filter Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
        letter-spacing: 0.5px;
      }
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .orbit-spin {
        transform-origin: 1040px 170px;
        animation: spin 20s linear infinite;
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      .border-shimmer {
        stroke-dasharray: 800;
        stroke-dashoffset: 1600;
        animation: shimmer 12s linear infinite;
      }
      @keyframes shimmer {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />
  <rect width="1200" height="340" rx="16" fill="url(#glow-left)" />
  <rect width="1200" height="340" rx="16" fill="url(#glow-right)" />

  <!-- Animated Border Outline -->
  <rect x="2" y="2" width="1196" height="336" rx="14" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="border-shimmer" opacity="0.7" />

  <!-- Abstract Decorative Shield & Circuit on Right -->
  <g class="orbit-spin" opacity="0.6">
    <circle cx="1040" cy="170" r="95" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="1040" cy="170" r="65" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1135" cy="170" r="5" fill="#38bdf8" filter="url(#neon-glow)" />
    <circle cx="945" cy="170" r="4" fill="#a855f7" filter="url(#neon-glow)" />
    <circle cx="1040" cy="75" r="5" fill="#6366f1" filter="url(#neon-glow)" />
    <circle cx="1040" cy="265" r="4" fill="#ec4899" filter="url(#neon-glow)" />
  </g>

  <!-- Central Emblem / Governance Pillars -->
  <g transform="translate(995, 125)" filter="url(#neon-glow)">
    <!-- Hexagonal Governance Seal -->
    <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="rgba(30, 27, 75, 0.6)" stroke="url(#accent-grad)" stroke-width="2.5" />
    <!-- Classical Pillar / Scales Icon -->
    <path d="M25 32 L65 32 M45 32 L45 74 M32 74 L58 74 M30 42 L20 54 M60 42 L70 54 M15 54 L25 54 M65 54 L75 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Left Header Content -->
  <g transform="translate(60, 65)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="19" class="badge-text" fill="#a5b4fc">🏛️ ENTERPRISE GOVERNANCE</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="75" class="title-text">
      Awesome Corporate Governance
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" class="subtitle-text">
      Curated Ecosystem of SaaS Board Portals, Entity Governance &amp; Open-Source Stacks
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" class="badge-text">📋 Board Management</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(170, 0)">
        <rect width="155" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🏢 Entity Governance</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(335, 0)">
        <rect width="145" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🤖 AI Intelligence</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(490, 0)">
        <rect width="145" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🔓 Open Source</text>
      </g>
    </g>
  </g>
</svg>
